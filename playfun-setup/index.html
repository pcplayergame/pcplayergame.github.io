<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlayFun 产品大厅</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F6EF7'/%3E%3Cpolygon points='26,20 46,32 26,44' fill='white'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --border: #e5e7eb;
    --shadow: 0 2px 8px rgba(31, 41, 55, 0.06);
    --shadow-lg: 0 8px 24px rgba(79, 110, 247, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ===== 顶部 ===== */
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .logo-badge {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6b8af9, #4f6ef7);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
  }
  .logo-badge svg { width: 24px; height: 24px; color: #fff; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  /* ===== 搜索 ===== */
  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .search-wrap svg {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 13px 16px 13px 46px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: var(--card);
    box-shadow: var(--shadow);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #searchInput:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.15);
  }

  /* ===== 列表 ===== */
  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .list-head h2 { font-size: 15px; font-weight: 600; }
  .list-head .count { font-size: 12px; color: var(--muted); }

  .item-list { display: flex; flex-direction: column; gap: 12px; }
  .item {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: transform .15s, box-shadow .15s;
    cursor: pointer;
  }
  .item:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(31, 41, 55, 0.08);
  }
  .item:hover .item-title { color: var(--primary); }
  .item-icon {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: rgba(79, 110, 247, 0.1);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
  }
  .item-icon svg { width: 20px; height: 20px; }
  .item-body { flex: 1; min-width: 0; }
  .item-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
    transition: color .15s;
  }
  .item-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .item-meta svg { width: 13px; height: 13px; }

  /* ===== 空状态 ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty p { font-size: 14px; }

  /* ===== 响应式 ===== */
  @media (max-width: 520px) {
    .container { padding: 20px 14px 60px; }
    h1 { font-size: 22px; }
    .item { padding: 14px; }
    #searchInput { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- ===== 顶部标题 ===== -->
  <header>
    <div class="logo">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </div>
      <h1>PlayFun 产品大厅</h1>
    </div>
    <p class="subtitle">按发布日期倒序展示</p>
  </header>

  <!-- ===== 搜索框 ===== -->
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="M21 21l-4.35-4.35"></path>
    </svg>
    <input id="searchInput" type="text" placeholder="搜索链接或替代文字…" />
  </div>

  <!-- ===== 列表 ===== -->
  <div class="list-head">
    <h2>已发布</h2>
    <span class="count" id="countLabel"></span>
  </div>
  <div class="item-list" id="itemList"></div>

</div>

<script>
/* ============================================================
 *  发布内容库：在这里增删条目
 *  每条格式：{ url: "链接", title: "替代文字", date: "YYYY-MM-DD" }
 *  页面会自动按 date 倒序（新的在前）展示
 * ============================================================ */
const ITEMS = [
  // 在这里添加条目，格式：{ url: "链接", title: "替代文字", date: "YYYY-MM-DD" }
];

/* ============================================================
 *  以下为渲染逻辑，一般不需要改动
 * ============================================================ */
(function () {
  const listEl = document.getElementById("itemList");
  const countEl = document.getElementById("countLabel");
  const searchInput = document.getElementById("searchInput");

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();

    // 按发布日期倒序（ISO 字符串可直接比较）
    const sorted = ITEMS.slice().sort((a, b) => b.date.localeCompare(a.date));

    const filtered = keyword
      ? sorted.filter(it =>
          (it.title || "").toLowerCase().includes(keyword) ||
          (it.url || "").toLowerCase().includes(keyword)
        )
      : sorted;

    countEl.textContent = `共 ${filtered.length} 条`;

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <p>没有找到匹配的条目</p>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map(it => `
      <div class="item" data-url="${escapeHtml(it.url)}">
        <div class="item-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </div>
        <div class="item-body">
          <div class="item-title">${escapeHtml(it.title)}</div>
          <div class="item-meta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            发布于 ${escapeHtml(it.date)}
          </div>
        </div>
      </div>
    `).join("");
  }

  // 点击整个卡片跳转
  listEl.addEventListener("click", function (e) {
    const item = e.target.closest(".item");
    if (!item) return;
    const url = item.dataset.url;
    if (url) window.open(url, "_blank", "noopener,noreferrer");
  });

  searchInput.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
