<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页-电脑高手Game</title>
    <style>
      :root {
        --bg-1: #edf3ff;
        --bg-2: #f7f2ff;
        --bg-3: #fff9f0;
        --glass: rgba(255, 255, 255, 0.52);
        --glass-strong: rgba(255, 255, 255, 0.7);
        --border: rgba(110, 130, 170, 0.2);
        --shadow: rgba(95, 103, 146, 0.18);
        --text: #1f2430;
        --muted: #5f6f86;
        --primary: #6b7cff;
        --primary-2: #8d63ff;
        --accent: #4dd0c8;
        --chip: rgba(107, 124, 255, 0.12);
        --line: rgba(99, 112, 146, 0.2);
      }

      body[data-theme="dark"] {
        --bg-1: #0d1220;
        --bg-2: #151d30;
        --bg-3: #111827;
        --glass: rgba(16, 22, 35, 0.62);
        --glass-strong: rgba(26, 30, 43, 0.82);
        --border: rgba(163, 177, 207, 0.14);
        --shadow: rgba(5, 8, 15, 0.46);
        --text: #edf4ff;
        --muted: #a8b6d1;
        --primary: #8ea2ff;
        --primary-2: #b39dff;
        --accent: #68e0d6;
        --chip: rgba(142, 162, 255, 0.12);
        --line: rgba(163, 177, 207, 0.14);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(109, 123, 255, 0.22), transparent 28%),
          radial-gradient(circle at bottom right, rgba(77, 208, 200, 0.18), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
        transition: background 0.3s ease, color 0.3s ease;
      }

      .page {
        min-height: 100%;
        padding: 42px 18px 80px;
        display: flex;
        justify-content: center;
      }

      .shell {
        width: min(1100px, 100%);
        position: relative;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 16px;
      }

      .theme-button {
        border: 1px solid var(--border);
        background: var(--glass);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        box-shadow: 0 10px 30px var(--shadow);
        transition: transform 0.2s ease, background 0.2s ease;
        font-weight: 600;
      }

      .theme-button:hover {
        transform: translateY(-1px);
      }

      .hero {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 20px 60px var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 30px clamp(20px, 4vw, 40px);
        position: relative;
        overflow: hidden;
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(12px);
      }

      .hero::before {
        width: 220px;
        height: 220px;
        right: -40px;
        top: -60px;
        background: rgba(109, 123, 255, 0.18);
      }

      .hero::after {
        width: 200px;
        height: 200px;
        left: -40px;
        bottom: -60px;
        background: rgba(77, 208, 200, 0.15);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--chip);
        border: 1px solid var(--border);
        padding: 7px 12px;
        border-radius: 999px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(2.3rem, 5vw, 4.2rem);
        line-height: 1.05;
        letter-spacing: -0.05em;
      }

      .subline {
        margin: 0;
        max-width: 720px;
        color: var(--muted);
        font-size: clamp(0.98rem, 1.7vw, 1.14rem);
        line-height: 1.8;
      }

      .stats {
        margin-top: 26px;
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 12px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px 18px;
      }

      .stat strong {
        display: block;
        font-size: clamp(1.15rem, 2vw, 1.6rem);
        margin-bottom: 4px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .content {
        margin-top: 26px;
      }

      .portal-panel {
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 18px 40px var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 18px 18px 22px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px 18px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 1.06rem;
        letter-spacing: 0.02em;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 600;
      }

      .column-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }

      .portal-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        transition: transform 0.2s ease, border-color 0.2s ease;
        min-height: 210px;
        display: flex;
        flex-direction: column;
      }

      .portal-card:hover {
        transform: translateY(-2px);
        border-color: rgba(107, 124, 255, 0.35);
      }

      .portal-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .portal-icon {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        font-size: 0.96rem;
        box-shadow: 0 12px 20px rgba(107, 124, 255, 0.2);
      }

      .portal-tag {
        display: inline-flex;
        align-items: center;
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--border);
        color: var(--primary);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .portal-title {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.4;
      }

      .portal-desc {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.75;
        font-size: 0.9rem;
      }

      .portal-link {
        margin-top: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(107, 124, 255, 0.12), rgba(77, 208, 200, 0.08));
        border: 1px solid var(--border);
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, border-color 0.2s ease;
        margin-top: 18px;
      }

      .portal-link:hover {
        transform: translateY(-1px);
        border-color: rgba(107, 124, 255, 0.35);
      }

      .portal-link span {
        opacity: 0.8;
      }

      @media (max-width: 640px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .portal-card {
          padding: 16px;
        }

        .portal-icon {
          width: 38px;
          height: 38px;
          font-size: 0.88rem;
        }
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="page">
      <main class="shell">
        <div class="topbar">
          <button class="theme-button" id="themeToggle" type="button" aria-label="切换主题">
            🌙 深色模式
          </button>
        </div>

        <header class="hero">
          <div class="eyebrow">Nested Glass Portal</div>
          <h1>电脑高手Game</h1>
          <p class="subline">
            中国的博主
          </p>

          <div class="stats" aria-label="网站概览数据">
            <div class="stat">
              <strong>12</strong>
              <span>主题栏目</span>
            </div>
            <div class="stat">
              <strong>04</strong>
              <span>设计层级</span>
            </div>
            <div class="stat">
              <strong>∞</strong>
              <span>扩展空间</span>
            </div>
          </div>
        </header>

        <section class="content" aria-label="栏目目录">
          <div class="portal-panel">
            <div class="panel-head">
              <h2>栏目列表</h2>
              <span class="pill">可扩展 / 可跳转</span>
            </div>

            <div class="column-grid" id="columnGrid" aria-live="polite"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const columns = [
        {
          tag: 'PlayFun产品大厅',
          title: 'PlayFun产品大厅',
          summary: 'PlayFun产品大厅',
          description: 'PlayFun产品大厅中有作者发表的所有软件。',
          url: 'pcplayergame.github.io/playfun-setup'
        },
        {
          tag: 'CSDN',
          title: 'CSDN',
          summary: 'csdn',
          description: 'windows。',
          url: '未开放'
        }

      ];

      const columnGrid = document.getElementById('columnGrid');

      const renderColumns = () => {
        columnGrid.innerHTML = columns.map((item, index) => `
          <article class="portal-card" aria-label="${item.title}">
            <div class="portal-top">
              <span class="portal-icon">${String(index + 1).padStart(2, '0')}</span>
              <span class="portal-tag">${item.tag}</span>
            </div>
            <h3 class="portal-title">${item.title}</h3>
            <p class="portal-desc">${item.summary}</p>
            <p class="portal-desc">${item.description}</p>
            <a class="portal-link" href="${item.url}" target="_blank" rel="noreferrer noopener">
              访问栏目 <span>→</span>
            </a>
          </article>
        `).join('');
      };

      renderColumns();

      const themeToggle = document.getElementById('themeToggle');
      const body = document.body;

      const applyTheme = (theme) => {
        const isDark = theme === 'dark';
        body.setAttribute('data-theme', isDark ? 'dark' : 'light');
        themeToggle.textContent = isDark ? '☀️ 浅色模式' : '🌙 深色模式';
        localStorage.setItem('theme', theme);
      };

      const savedTheme = localStorage.getItem('theme') || 'light';
      applyTheme(savedTheme);

      themeToggle.addEventListener('click', () => {
        const nextTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
      });
    </script>
  </body>
</html>
